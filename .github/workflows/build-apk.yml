name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub's ubuntu-latest runners already ship a full Android SDK
      # (ANDROID_HOME is preset) with recent platforms/build-tools and
      # licenses pre-accepted, so no separate SDK-install action is needed.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Diagnose constraintlayout dependency
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon | grep -i -A2 -B2 constraintlayout || true
          AAR=$(find ~/.gradle/caches -iname "constraintlayout-2.1.4.aar" 2>/dev/null | head -1)
          echo "AAR path: $AAR"
          if [ -n "$AAR" ]; then unzip -l "$AAR"; fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Always available from the "Actions" tab on the run that built it.
      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A stable link that always points at the newest build:
      # https://github.com/${{ github.repository }}/releases/latest
      - name: Publish release with APK attached
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from commit ${{ github.sha }}.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
